
services:
  - type: web
    name: airwise-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.import_data && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        value: http://localhost:5173
